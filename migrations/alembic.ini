[alembic]
script_location = migrations
# The real URL is injected at runtime (see app/migrations.py); this is only
# a fallback for running the alembic CLI by hand.
sqlalchemy.url = sqlite:///netvulnx.db

[loggers]
keys = root

[handlers]
keys = console

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

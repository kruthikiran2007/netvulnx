{% extends "base.html" %}
{% block title %}Change password · NetVulnX{% endblock %}
{% block content %}
<h1>Change password</h1>

<form method="post" action="{{ url_for('main.password_submit') }}" class="form">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <label>
    Current password
    <input type="password" name="current_password" required autocomplete="current-password">
  </label>
  <label>
    New password
    <input type="password" name="new_password" required autocomplete="new-password">
    <span class="hint">At least 8 characters.</span>
  </label>
  <button class="btn primary" type="submit">Change password</button>
</form>

<h2>Reset email</h2>
<p class="muted">Used only for "Forgot password?" reset links. Currently:
<strong>{{ current_email or "not set" }}</strong></p>
<form method="post" action="{{ url_for('main.email_submit') }}" class="form">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <label>
    Email address
    <input type="email" name="email" maxlength="255" value="{{ current_email or '' }}" placeholder="you@company.com">
  </label>
  <button class="btn" type="submit">Save email</button>
</form>
{% endblock %}

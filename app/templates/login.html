{% extends "base.html" %}
{% block title %}Log in — NetVulnX{% endblock %}
{% block content %}
<h1>{{ _('Log in') }}</h1>
<p class="muted">{{ _('NetVulnX requires an account. Every action is audit-logged.') }}</p>
<form method="post" action="{{ url_for('main.login') }}" class="card">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ _('Username') }}
    <input type="text" name="username" required autocomplete="username" autofocus>
  </label>
  <label>{{ _('Password') }}
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit" class="btn">{{ _("Log in") }}</button>
</form>
<p class="muted"><a href="{{ url_for('main.forgot_form') }}">{{ _('Forgot your password?') }}</a></p>
{% endblock %}
